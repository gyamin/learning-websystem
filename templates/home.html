<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン済み</title>
</head>
<body>
  <div class="login-container">
    <h1>ログイン成功</h1>
    <div class="login-card">
      <p class="success-message">ログインが成功しました</p>
      <p class="login-user">ログインユーザー: <span>{{ login_user['user_name'] }}</span></p>
      <a href="/web/top" class="link-button">トップページへ</a>
    </div>
  </div>
</body>
<style>
  body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
  }

  .login-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
  }

  h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
      color: #1f2937;
  }

  .login-card {
      background-color: #ffffff;
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
  }

  .success-message {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
      color: #2563eb;
  }

  .login-user {
      margin: 0 0 24px;
      font-size: 15px;
      color: #374151;
  }

  .login-user span {
      font-weight: 700;
      color: #1f2937;
  }

  .link-button {
      display: inline-block;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background-color: #2563eb;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.2s, transform 0.1s;
  }

  .link-button:hover {
      background-color: #1d4ed8;
  }

  .link-button:active {
      transform: translateY(1px);
  }
</style>
</html>
