<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ホーム</title>
</head>
<body>
  <div class="home-container">
    <h1>ホーム画面</h1>
    <div class="home-card">
      <p class="user-name">{{ login_user['user_name'] }}</p>

      {% if login_user['user_type'] == 'admin' %}
        <p class="user-role">管理者</p>
      {% elif login_user['user_type'] == 'editor' %}
        <p class="user-role">編集者</p>
      {% elif login_user['user_type'] == 'operator' %}
        <p class="user-role">運用者</p>
      {% else %}
        <p class="user-role">不明なユーザー</p>
      {% endif %}
    </div>
  </div>
</body>
<style>
  body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
  }

  .home-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
  }

  h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
      color: #1f2937;
  }

  .home-card {
      background-color: #ffffff;
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
  }

  .user-name {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
  }

  .user-role {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
      color: #2563eb;
  }

  .user-type {
      margin: 0;
      font-size: 14px;
      color: #6b7280;
  }
</style>
</html>
