<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お知らせ詳細</title>
</head>
<body>
<div class="page">
    <div class="content">
        <h1>{{ notification.title }}</h1>
        <div class="detail-image">
            <img src="{{ notification.detail_image_path }}" alt=""/>
        </div>
        <div class="publication-date">
            {% if notification.publication_start_date %}
            <p>{{ notification.publication_start_date.strftime('%Y年%m月%d日') }} 公開</p>
            {% endif %}
        </div>
        <div class="content-body">
            <p>{{ notification.content_body }}</p>
        </div>
    </div>

    {% if notification.link_url %}
    <div class="bottom-action">
        <a href="{{ notification.link_url }}" class="detail-button">詳細はこちら</a>
    </div>
    {% endif %}
</div>
</body>

<style>
    body {
        margin: 0;
        background-color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", "Meiryo", sans-serif;
        color: #333333;
    }

    .page {
        max-width: 390px;
        min-height: 100vh;
        margin: 0 auto;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
    }

    .content {
        padding: 24px 16px 100px;
    }

    h1 {
        margin: 0 0 16px;
        font-size: 24px;
        line-height: 1.5;
        font-weight: bold;
    }

    .detail-image {
        margin-bottom: 16px;
    }

    .detail-image img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
    }

    .publication-date {
        margin-bottom: 20px;
        color: #666666;
        font-size: 14px;
    }

    .publication-date p {
        margin: 0;
    }

    .content-body {
        font-size: 16px;
        line-height: 1.8;
    }

    .content-body p {
        margin: 0;
        white-space: pre-wrap;
    }

    .bottom-action {
        position: sticky;
        bottom: 0;
        padding: 12px 16px 20px;
        background: linear-gradient(to top, #ffffff 85%, rgba(255, 255, 255, 0));
    }

    .detail-button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        background-color: #ec2961;
        color: #ffffff;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        padding: 14px 16px;
        border-radius: 999px;
    }
</style>
</html>
