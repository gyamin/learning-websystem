<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found</title>
</head>
<body>
<div class="page">
    <div class="content error-content">
        <div class="error-icon">!</div>
        <p class="error-code">404 Not Found</p>
        <h1>ページが見つかりません</h1>
        <p class="error-message">
            申し訳ありません。<br>
            指定されたお知らせは存在しないか、<br>
            削除された可能性があります。
        </p>
    </div>

    <div class="bottom-action">
        <a href="/web/notifications" class="detail-button">お知らせ一覧へ戻る</a>
    </div>
</div>
</body>
<style>
    body {
        margin: 0;
        background-color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", "Meiryo", sans-serif;
        color: #333333;
    }

    .page {
        max-width: 390px;
        min-height: 100vh;
        margin: 0 auto;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
    }

    .content {
        padding: 24px 16px 100px;
    }

    .error-content {
        min-height: calc(100vh - 140px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
    }

    .error-icon {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background-color: #fde7ef;
        color: #ec2961;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 20px;
        box-shadow: 0 6px 18px rgba(236, 41, 97, 0.12);
    }

    .error-code {
        margin: 0 0 12px;
        color: #ec2961;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 0.04em;
    }

    h1 {
        margin: 0 0 16px;
        font-size: 24px;
        line-height: 1.5;
        font-weight: bold;
    }

    .error-message {
        margin: 0;
        color: #666666;
        font-size: 15px;
        line-height: 1.8;
    }

    .bottom-action {
        position: sticky;
        bottom: 0;
        padding: 12px 16px 20px;
        background: linear-gradient(to top, #ffffff 85%, rgba(255, 255, 255, 0));
    }

    .detail-button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        background-color: #ec2961;
        color: #ffffff;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        padding: 14px 16px;
        border-radius: 999px;
    }
</style>
</html>
